name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run Rust tests
        run: cargo test

      - name: Build Python extension
        env:
          PYO3_PYTHON: python
        run: cargo build --features python --lib

      - name: Run Python binding tests
        run: python -m unittest tests.test_python_bindings

      - name: Install maturin
        run: python -m pip install --upgrade pip maturin

      - name: Build wheel
        env:
          PYO3_PYTHON: python
        run: maturin build --release --features python -o dist

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel-${{ runner.os }}-py313
          path: dist/*.whl
          if-no-files-found: error
