name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create, for example v0.0.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
          - arch: arm64
            runs-on: ubuntu-24.04-arm

    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install maturin
        run: python -m pip install --upgrade pip maturin

      - name: Build wheel
        env:
          PYO3_PYTHON: python
        run: maturin build --release --features python -o dist

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel-${{ runner.os }}-${{ matrix.arch }}-py313
          path: dist/*.whl
          if-no-files-found: error

  create-release:
    needs: build-wheel
    runs-on: ubuntu-latest

    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: python-wheel-*
          path: release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f -name '*.whl' -print0 | sort -z)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No wheel assets found under release-assets" >&2
            exit 1
          fi

          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --target "${GITHUB_SHA}" \
            "${assets[@]}"
