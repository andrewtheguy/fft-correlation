[package]
name = "fft-correlation"
version = "0.0.1"
edition = "2021"

[lib]
name = "fft_correlation"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3", "pyo3/extension-module"]

[dependencies]
realfft = "3.5"
pyo3 = { version = "0.27.2", optional = true, features = ["abi3-py38"] }
