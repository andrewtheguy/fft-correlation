[build-system]
requires = ["maturin>=1.9.4,<2.0"]
build-backend = "maturin"

[project]
name = "fft-correlation"
version = "0.0.1"
description = "PyO3 bindings for FFT-based 1D correlation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.26"]

[tool.maturin]
features = ["python"]
